<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirm Email Change - Tesla Capital</title>
</head>
<body style="margin:0; padding:24px 10px; background-color:#0a0a0a; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color:#ffffff; -webkit-text-size-adjust:100%;">
  <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0" style="max-width:500px; margin:0 auto; background-color:#141414; border:1px solid #1f1f1f;">
    <tr>
      <td style="height:3px; background-color:#e53935;"></td>
    </tr>
    <tr>
      <td style="padding:24px 28px 18px 28px; border-bottom:1px solid #1f1f1f;">
        <span style="font-size:15px; font-weight:800; letter-spacing:2px; color:#ffffff;">TESLA</span>
        <span style="font-family:monospace; font-size:14px; letter-spacing:3px; color:#8a8a8a;"> CAPITAL</span>
      </td>
    </tr>
    <tr>
      <td style="padding:28px;">
        <p style="font-family:monospace; font-size:11px; text-transform:uppercase; letter-spacing:2px; color:#e53935; margin:0 0 10px 0; font-weight:700;">Account Update</p>
        <h1 style="font-size:22px; font-weight:700; color:#ffffff; margin:0 0 14px 0; letter-spacing:-0.3px;">Confirm email change</h1>
        <p style="font-size:14px; line-height:1.5; color:#a0a0a0; margin:0 0 24px 0;">
          Confirm changing your Tesla Capital account email address to <strong style="color:#ffffff;">{{ .Email }}</strong>.
        </p>
        
        <table role="presentation" border="0" cellspacing="0" cellpadding="0" style="margin:0 0 24px 0;">
          <tr>
            <td>
              <a href="{{ .ConfirmationURL }}" target="_blank" style="background-color:#e53935; color:#ffffff; font-family:monospace; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:1.5px; text-decoration:none; padding:12px 24px; display:inline-block; border:1px solid #e53935;">
                Confirm Change &rarr;
              </a>
            </td>
          </tr>
        </table>

        <p style="font-size:12px; line-height:1.4; color:#666666; margin:20px 0 0 0; padding-top:16px; border-top:1px solid #1f1f1f;">
          If you did not request this change, please secure your account immediately.
        </p>
      </td>
    </tr>
    <tr>
      <td style="padding:16px 28px; background-color:#0a0a0a; border-top:1px solid #1f1f1f; font-family:monospace; font-size:10px; color:#555555;">
        Tesla Capital Security &bull; Settings Verification
      </td>
    </tr>
  </table>
</body>
</html>
